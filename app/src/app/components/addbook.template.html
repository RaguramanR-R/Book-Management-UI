<div fxLayout="row wrap" style=" margin-top:20px " fxLayoutAlign="center stretch" [fxShow]="true">
  <h3 style="color: black;     text-align: center;     font-weight: 800; ">
    Add Book</h3>
</div>
<div fxLayout="row wrap" fxLayoutAlign="start stretch" [fxShow]="true"><button mat-button class="back-btn" routerLink="/book_list">back</button></div>
<div fxLayout="column wrap" fxLayoutAlign="start stretch">
  <div fxLayout="row wrap" fxLayoutAlign="center stretch" [fxShow]="true">
    <mat-form-field [appearance]="&apos;legacy&apos;" [floatLabel]="&apos;auto&apos;" [hideRequiredMarker]="false">
      <input matInput [(ngModel)]="page.isbn" name="isbnInputField" placeholder="Enter ISBN Number" [required]="false" (ngModelChange)="onChangeisbn($event)">

    </mat-form-field><button mat-button class="search-btn" (click)="sd_0FDevCOAiNf1JPi8()" [disabled]="!page.isbn || page.isbn === &apos;&apos;">Search</button>
  </div>
  <div fxLayout="column wrap" class="hide-column" fxLayoutAlign="start stretch" [fxShow]="page.isShow">
    <div fxLayout="column" class="book-table">
      <table mat-table [dataSource]="page?.tableData" class="table-width-fix">
        <tr mat-header-row *matHeaderRowDef="[&apos;title&apos;,&apos;publisher&apos;,&apos;publish_date&apos;]"></tr>
        <tr mat-row *matRowDef="let row; columns: [&apos;title&apos;,&apos;publisher&apos;,&apos;publish_date&apos;];"></tr>

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let table; let i = index;">{{table.title}}</td>
        </ng-container>

        <ng-container matColumnDef="publisher">
          <th mat-header-cell *matHeaderCellDef>Author</th>
          <td mat-cell *matCellDef="let table; let i = index;">{{table.publisher}}</td>
        </ng-container>

        <ng-container matColumnDef="publish_date">
          <th mat-header-cell *matHeaderCellDef>Published Year</th>
          <td mat-cell *matCellDef="let table; let i = index;">{{table.publish_date}}</td>
        </ng-container>
      </table>
    </div>
    <div fxLayout="row wrap" fxLayoutAlign="center center" [fxShow]="true"><button mat-button class="add-btn" (click)="sd_nJkjDEbrjvHkcMEB()" [disabled]="!page?.tableData || page.tableData.length === 0">Add</button></div>
  </div>
</div>
