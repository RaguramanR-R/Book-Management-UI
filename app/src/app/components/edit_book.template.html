<div fxLayout="row wrap" style=" margin-top:20px " fxLayoutAlign="center stretch" [fxShow]="true">
  <h3 style="color: black;     text-align: center;     font-weight: 800;   ">
    Edit Book</h3>
</div>
<div fxLayout="row wrap" fxLayoutAlign="start start" [fxShow]="true"><button mat-button style=" background: #1976d2;          color: white;           margin-top: 10px;              margin-bottom: 10px;" class="back-btn" routerLink="/book_list">Back</button></div>
<div fxLayout="row wrap" fxLayoutAlign="center stretch" [fxShow]="true">
  <mat-form-field [appearance]="&apos;legacy&apos;" [floatLabel]="&apos;auto&apos;" [hideRequiredMarker]="false">
    <input matInput [(ngModel)]="page.isbn" placeholder="Enter ISBN" [required]="false">

  </mat-form-field><button mat-button class="update-btn" (click)="update(page.isbn)" [disabled]="!page.isbn || page.isbn === &apos;&apos;">Update</button>
</div>
<div fxLayout="column wrap" fxLayoutAlign="start stretch" [fxShow]="true">
  <h4 style="color: black;    font-weight: 800;   ">
    Selected Book Details:</h4>
  <div fxLayout="column" class="book-table">
    <table mat-table [dataSource]="page?.tableData" class="table-width-fix">
      <tr mat-header-row *matHeaderRowDef="[&apos;isbn&apos;,&apos;title&apos;,&apos;author&apos;,&apos;publishedYear&apos;]"></tr>
      <tr mat-row *matRowDef="let row; columns: [&apos;isbn&apos;,&apos;title&apos;,&apos;author&apos;,&apos;publishedYear&apos;];"></tr>

      <ng-container matColumnDef="isbn">
        <th mat-header-cell *matHeaderCellDef>ISBN</th>
        <td mat-cell *matCellDef="let table; let i = index;">{{table.isbn}}</td>
      </ng-container>

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let table; let i = index;">{{table.title}}</td>
      </ng-container>

      <ng-container matColumnDef="author">
        <th mat-header-cell *matHeaderCellDef>Author</th>
        <td mat-cell *matCellDef="let table; let i = index;">{{table.author}}</td>
      </ng-container>

      <ng-container matColumnDef="publishedYear">
        <th mat-header-cell *matHeaderCellDef>Published Year</th>
        <td mat-cell *matCellDef="let table; let i = index;">{{table.publishedYear}}</td>
      </ng-container>
    </table>
  </div>
</div>
